apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-tunnel
  namespace: demo-api
  labels:
    app: demo-api-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api-tunnel
  template:
    metadata:
      labels:
        app: demo-api-tunnel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://demo-api.demo-api.svc.cluster.local:80
          ports:
            - name: metrics
              containerPort: 2000
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 15
